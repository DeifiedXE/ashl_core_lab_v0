<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qingyin Home Upper Console Preview v0</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101314;
      --panel: #171c1f;
      --line: #2b3337;
      --text: #edf1f2;
      --muted: #9aa5a9;
      --accent: #57c7b2;
      --warn: #d8b656;
      --error: #df6868;
      --user: #b9d7ff;
      --raw: #b8f0cf;
      --system: #d1c4f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans TC", Arial, sans-serif;
      letter-spacing: 0;
    }

    .shell {
      width: min(920px, calc(100vw - 24px));
      margin: 18px auto;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(104px, 1.2fr) minmax(84px, 0.8fr) minmax(160px, 1.2fr) minmax(84px, 0.8fr) 40px;
      gap: 10px;
      align-items: center;
      min-height: 48px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
    }

    .status-item {
      display: flex;
      gap: 7px;
      align-items: center;
      min-width: 0;
      font-size: 14px;
      white-space: nowrap;
    }

    .label {
      color: var(--muted);
    }

    .indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #333b3f;
      flex: 0 0 auto;
    }

    .indicator.active {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(87, 199, 178, 0.6);
    }

    .indicator.warn {
      background: var(--warn);
    }

    .settings {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      background: #20272b;
      color: var(--text);
      border-radius: 6px;
      font-size: 18px;
    }

    .timeline {
      min-height: 320px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      overflow: auto;
    }

    .entry {
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr);
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 14px;
    }

    .entry:last-child {
      border-bottom: 0;
    }

    .entry .who {
      color: var(--muted);
    }

    .entry.user .text {
      color: var(--user);
    }

    .entry.raw .text {
      color: var(--raw);
      font-family: Consolas, "SFMono-Regular", monospace;
    }

    .entry.system .text {
      color: var(--system);
    }

    .inputbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 84px;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }

    input[type="text"] {
      width: 100%;
      min-height: 36px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0f1214;
      color: var(--text);
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #243034;
      color: var(--text);
      font: inherit;
      cursor: default;
    }

    .log {
      min-height: 132px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .log-title {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    .log-line {
      padding: 3px 0;
      color: var(--muted);
    }

    .log-line.notice {
      color: var(--warn);
    }

    .developer {
      border-top: 1px solid var(--line);
      padding: 8px 12px 12px;
    }

    .developer summary {
      color: var(--muted);
      font-size: 13px;
    }

    .token-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .token-controls button {
      min-width: 44px;
      height: 32px;
      font-family: Consolas, "SFMono-Regular", monospace;
    }

    @media (max-width: 680px) {
      .topbar {
        grid-template-columns: 1fr 1fr;
      }

      .settings {
        justify-self: start;
      }

      .entry {
        grid-template-columns: 1fr;
        gap: 2px;
      }
    }
  </style>
</head>
<body>
  <main class="shell" aria-label="Qingyin Home upper console preview">
    <section class="topbar" aria-label="operator status bar">
      <div class="status-item"><span class="label">Total State</span><strong>休眠</strong></div>
      <div class="status-item"><span class="indicator"></span><span class="label">Mic</span><span>待命</span></div>
      <div class="status-item"><span class="label">Output Volume</span><input type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Output Volume"></div>
      <div class="status-item"><span class="indicator"></span><span class="label">Camera</span><span>待命</span></div>
      <button class="settings" aria-label="Hardware Settings">⚙</button>
    </section>

    <section class="timeline" aria-label="Text Timeline">
      <div class="entry user">
        <div class="who">[User]</div>
        <div class="text">test input</div>
      </div>
      <div class="entry raw">
        <div class="who">[Qingyin Raw Output] fixture_only</div>
        <div class="text">T07</div>
      </div>
      <div class="entry system">
        <div class="who">[System]</div>
        <div class="text">Teacher review is pending.</div>
      </div>
    </section>

    <section class="inputbar" aria-label="local text input">
      <input type="text" value="" aria-label="Text Input" placeholder="Text Input">
      <button>Send</button>
    </section>

    <section class="log" aria-label="status log">
      <div class="log-title">Status Log</div>
      <div class="log-line">Runtime process available.</div>
      <div class="log-line notice">Output intent was rate-limited.</div>
      <div class="log-line">Local output sink policy keeps sound disabled.</div>
    </section>

    <details class="developer">
      <summary>Developer Test Controls</summary>
      <div class="token-controls" aria-label="fixture raw output token controls">
        <button>T00</button>
        <button>T01</button>
        <button>T02</button>
        <button>T03</button>
      </div>
    </details>
  </main>
</body>
</html>
